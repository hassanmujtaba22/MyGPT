# MyGPT coding configuration — fine-tune a CODE model on YOUR GitHub repos.
#
# Build the dataset first:
#   export GITHUB_TOKEN=ghp_xxx
#   python scripts/github_dataset.py --user <you> --out data/code_train.jsonl
# Then train:
#   python scripts/train.py --config configs/coding.yaml

model:
  # Code-specialized base model. Pick by VRAM (run scripts/check_hardware.py):
  #   24GB+ : Qwen/Qwen2.5-Coder-7B-Instruct
  #   8-16GB: Qwen/Qwen2.5-Coder-3B-Instruct  (good default)
  #   6-8GB : Qwen/Qwen2.5-Coder-1.5B-Instruct
  name: "Qwen/Qwen2.5-Coder-3B-Instruct"
  load_in_4bit: true
  # Code files are long — a bigger context helps. Lower if you hit OOM.
  max_seq_len: 2048

data:
  train_file: "data/code_train.jsonl"
  eval_file: ""

lora:
  r: 32             # a bit higher than chat: code style needs more capacity
  alpha: 64
  dropout: 0.05
  target_modules: "all-linear"

training:
  output_dir: "outputs/mygpt-coder-adapter"
  epochs: 2          # code datasets are large; 2 epochs is usually enough
  batch_size: 1
  grad_accum: 16
  learning_rate: 1.5e-4
  warmup_ratio: 0.03
  weight_decay: 0.0
  logging_steps: 10
  save_steps: 200
  seed: 42
  precision: "auto"

# Reuse the same backend + RAG sections as the default config. The web UI and
# RAG work with the coder adapter too — point --config at this file.
backend:
  type: "transformers"
  ollama:
    host: "http://localhost:11434"
    model: "qwen2.5-coder:3b"

rag:
  source_dir: "knowledge"
  index_dir: "outputs/rag_index"
  embed_model: "sentence-transformers/all-MiniLM-L6-v2"
  chunk_size: 800
  chunk_overlap: 150
  top_k: 4
