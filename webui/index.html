<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MyGPT</title>
<style>
  :root {
    --bg: #0f1117; --panel: #171a23; --panel2: #1f232e; --border: #2a2f3a;
    --text: #e6e8ee; --muted: #9aa3b2; --accent: #6d8bff; --accent2: #3a4a8a;
    --user-bg: #243056; --bot-bg: #1c2330;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    background: var(--bg); color: var(--text); height: 100vh; display: flex;
    flex-direction: column;
  }
  header {
    padding: 12px 18px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 14px; background: var(--panel);
  }
  header h1 { font-size: 17px; margin: 0; font-weight: 650; }
  .status { font-size: 12px; color: var(--muted); }
  .spacer { flex: 1; }
  .toggle { display: flex; align-items: center; gap: 8px; font-size: 13px;
    color: var(--muted); cursor: pointer; user-select: none; }
  .toggle input { accent-color: var(--accent); width: 16px; height: 16px; }
  main { flex: 1; display: flex; overflow: hidden; }
  #chat {
    flex: 1; overflow-y: auto; padding: 22px; display: flex; flex-direction: column;
    gap: 14px;
  }
  .msg { max-width: 760px; padding: 12px 15px; border-radius: 12px;
    line-height: 1.5; white-space: pre-wrap; word-wrap: break-word; }
  .user { align-self: flex-end; background: var(--user-bg); border: 1px solid #2f3c63; }
  .bot { align-self: flex-start; background: var(--bot-bg); border: 1px solid var(--border); }
  .bot .cite { color: var(--accent); font-weight: 600; }
  .who { font-size: 11px; color: var(--muted); margin-bottom: 5px;
    text-transform: uppercase; letter-spacing: .05em; }
  .sources { align-self: flex-start; max-width: 760px; font-size: 12.5px;
    color: var(--muted); background: var(--panel2); border: 1px solid var(--border);
    border-radius: 10px; padding: 10px 13px; }
  .sources b { color: var(--text); }
  .src-item { margin-top: 6px; }
  .src-item .lbl { color: var(--accent); }
  .score { color: var(--muted); }
  footer { border-top: 1px solid var(--border); padding: 14px 18px; background: var(--panel); }
  .composer { display: flex; gap: 10px; max-width: 1000px; margin: 0 auto; }
  textarea {
    flex: 1; resize: none; background: var(--panel2); color: var(--text);
    border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px;
    font: inherit; font-size: 15px; min-height: 48px; max-height: 180px;
  }
  textarea:focus { outline: none; border-color: var(--accent2); }
  button.send {
    background: var(--accent); color: #fff; border: 0; border-radius: 10px;
    padding: 0 22px; font-size: 15px; font-weight: 600; cursor: pointer;
  }
  button.send:disabled { opacity: .5; cursor: default; }
  .hint { text-align: center; color: var(--muted); font-size: 12px; margin-top: 8px; }
  .empty { margin: auto; color: var(--muted); text-align: center; max-width: 420px; }
  .empty h2 { color: var(--text); font-weight: 600; }
  .typing { color: var(--muted); font-style: italic; }
</style>
</head>
<body>
<header>
  <h1>🤖 MyGPT</h1>
  <span class="status" id="status">connecting…</span>
  <div class="spacer"></div>
  <label class="toggle" id="ragToggleWrap" title="Answer using your documents">
    <input type="checkbox" id="ragToggle" /> Use my documents (RAG)
  </label>
</header>
<main>
  <div id="chat">
    <div class="empty" id="empty">
      <h2>Chat with MyGPT</h2>
      <p>Your locally fine-tuned model. Toggle <b>Use my documents</b> to ground
      answers in your indexed files, with page-aware citations.</p>
    </div>
  </div>
</main>
<footer>
  <div class="composer">
    <textarea id="input" placeholder="Ask MyGPT…  (Enter to send, Shift+Enter for newline)"></textarea>
    <button class="send" id="send">Send</button>
  </div>
  <div class="hint" id="hint"></div>
</footer>

<script>
const chat = document.getElementById('chat');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send');
const ragToggle = document.getElementById('ragToggle');
const ragWrap = document.getElementById('ragToggleWrap');
const statusEl = document.getElementById('status');
const hintEl = document.getElementById('hint');
const empty = document.getElementById('empty');

let history = [];   // [{role, content}]
let busy = false;

// Load backend / RAG status
fetch('/api/info').then(r => r.json()).then(info => {
  statusEl.textContent = info.backend;
  hintEl.textContent = info.rag_available
    ? `RAG ready · ${info.rag_chunks} chunks indexed`
    : 'RAG index not built — run scripts/rag_ingest.py to enable document Q&A';
  if (!info.rag_available) {
    ragToggle.disabled = true;
    ragWrap.style.opacity = .5;
    ragWrap.title = 'Build a RAG index first (scripts/rag_ingest.py)';
  }
}).catch(() => statusEl.textContent = 'offline');

function escapeHtml(s) {
  return s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
}
// Highlight [1], [2] citation markers
function renderBot(text) {
  return escapeHtml(text).replace(/\[(\d+)\]/g, '<span class="cite">[$1]</span>');
}

function addMsg(role, text) {
  empty.style.display = 'none';
  const div = document.createElement('div');
  div.className = 'msg ' + (role === 'user' ? 'user' : 'bot');
  div.innerHTML = `<div class="who">${role === 'user' ? 'You' : 'MyGPT'}</div>` +
                  (role === 'user' ? escapeHtml(text) : renderBot(text));
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

function addSources(sources) {
  if (!sources || !sources.length) return;
  const div = document.createElement('div');
  div.className = 'sources';
  div.innerHTML = '<b>Sources</b>' + sources.map(s =>
    `<div class="src-item"><span class="lbl">[${s.n}] ${escapeHtml(s.label)}</span> ` +
    `<span class="score">· ${s.score}</span><br>${escapeHtml(s.preview)}…</div>`
  ).join('');
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

async function send() {
  const message = input.value.trim();
  if (!message || busy) return;
  busy = true; sendBtn.disabled = true;
  addMsg('user', message);
  input.value = '';

  const typing = addMsg('bot', '…');
  typing.classList.add('typing');

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        message, history, use_rag: ragToggle.checked,
      }),
    });
    const data = await res.json();
    typing.remove();
    addMsg('bot', data.reply || '(no response)');
    if (ragToggle.checked) addSources(data.sources);
    history.push({role: 'user', content: message});
    history.push({role: 'assistant', content: data.reply});
  } catch (e) {
    typing.remove();
    addMsg('bot', '⚠️ Error contacting the server: ' + e.message);
  } finally {
    busy = false; sendBtn.disabled = false; input.focus();
  }
}

sendBtn.addEventListener('click', send);
input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});
input.focus();
</script>
</body>
</html>
